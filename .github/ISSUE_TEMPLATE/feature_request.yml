name: Feature Request
description: Suggest an idea, enhancement, or mod integration for Unslotted
title: "[FEATURE]: "
labels: ["enhancement"]
assignees:
  - Yuri-Almir-Pinto
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Unslotted better? Type it up!

  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      description: What kind of feature are you requesting?
      options:
        - "Core Mechanic / Storage Logic"
        - "UI / UX Improvement"
        - "Mod Integration / Compatibility"
        - "Config / Customization Option"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or missing capability is (e.g., "It takes too long to move items around when...").
      placeholder: I feel frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: Tell us how you imagine this feature working in-game.
      placeholder: It would be awesome if the slotless crate could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've thought about.
      placeholder: Alternatively, maybe a keybind that...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, reference mods, or mockups/screenshots here.
      placeholder: Paste images, links, or extra details here...
